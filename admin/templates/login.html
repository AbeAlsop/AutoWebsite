{% extends "base.html" %}

{% block content %}
<section class="panel">
    <h1>{{ app_name }}</h1>
    <form action="/login" method="post">
        <label>
            Username
            <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
    </form>
</section>
{% endblock %}
