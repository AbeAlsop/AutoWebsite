{% extends "base.html" %}

{% block content %}
<section class="panel">
    <header class="toolbar">
        <h1>{{ app_name }} Dashboard</h1>
        <p class="muted">Signed in as {{ username }}</p>
        <form action="/logout" method="post">
            <button type="submit">Log out</button>
        </form>
    </header>

    <form action="/prompt" method="post" class="stack">
        <label>
            Prompt
            <textarea name="prompt" rows="8" required></textarea>
        </label>
        <button type="submit">Submit prompt</button>
    </form>

    <form action="/upload" method="post" enctype="multipart/form-data" class="stack">
        <label>
            Upload
            <input type="file" name="file" required>
        </label>
        <button type="submit">Upload file</button>
    </form>

    <p><a href="/history">View history</a></p>
</section>
{% endblock %}
