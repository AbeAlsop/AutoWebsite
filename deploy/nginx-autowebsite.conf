# Replace example.com with the site's real domain before enabling this file.
# The public site is served directly from the atomically switched `current`
# release. Nginx never reads the source checkout, staging tree, or workspaces.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # Certbot creates and maintains these files.
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 10m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # These locations must precede the public static-site fallback.
    location = /admin { proxy_pass http://127.0.0.1:8000; include proxy_params; }
    location ^~ /admin/ { proxy_pass http://127.0.0.1:8000; include proxy_params; }
    location ^~ /static/ { proxy_pass http://127.0.0.1:8000; include proxy_params; }
    location = /health { proxy_pass http://127.0.0.1:8000; include proxy_params; }

    # Optional extra protection for the single administrator:
    # allow 203.0.113.10;
    # deny all;
    # Put the two lines above inside each /admin location when the admin has a
    # stable IP address or reaches the server through a VPN.

    root /srv/autowebsite/state/published/current;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
